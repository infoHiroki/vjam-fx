<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>VJam FX</title>
</head>
<body>
  <div class="popup">
    <header class="header">
      <img class="logo" src="lockup.png" alt="VJam FX">
      <div class="header-right">
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <label class="toggle-switch" title="ON / OFF">
          <input type="checkbox" id="toggle">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <div id="settings-section" class="settings-section" style="display:none">
      <div class="setting-row" title="Start Auto + Rnd when turned ON">
        <label>Auto start</label>
        <select id="setting-auto-start">
          <option value="on" selected>ON</option>
          <option value="off">OFF</option>
        </select>
      </div>
      <div class="setting-row" title="Also turn ON in every tab you switch to">
        <label>All tabs</label>
        <button id="setting-all-tabs" class="audio-btn">OFF</button>
      </div>
      <div class="setting-row" title="Up to half of Cycle">
        <label>Fade</label>
        <select id="setting-fade">
          <option value="0">0s</option>
          <option value="3">3s</option>
          <option value="5" selected>5s</option>
          <option value="8">8s</option>
          <option value="12">12s</option>
        </select>
      </div>
      <div class="setting-row" title="How long Auto / Rnd keep each look">
        <label>Cycle</label>
        <select id="setting-cycle">
          <option value="8">8s</option>
          <option value="15" selected>15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Sensitivity</label>
        <select id="setting-sensitivity">
          <option value="lo">Lo</option>
          <option value="mid" selected>Mid</option>
          <option value="hi">Hi</option>
        </select>
      </div>
      <!-- この端末で重いので外したもの(Next / Auto が選ばない)。Restore で全部戻す -->
      <div class="setting-row" title="Presets too heavy for this device. Next / Auto skip them">
        <label>Too heavy</label>
        <span class="heavy-note"><span id="heavy-count">0</span> skipped</span>
        <button id="btn-heavy-reset" class="mini-btn" disabled>Restore</button>
      </div>
    </div>

    <div class="main">
      <!-- いま流れているもの。名前と BPM は popup が開いている間エンジンから読み直す -->
      <section id="stage" class="stage" data-mode="off">
        <div class="mode">
          <span id="stage-mode" class="big">OFF</span>
          <span id="stage-bpm" class="bpm" hidden></span>
          <span id="stage-beat" class="beat"></span>
        </div>
        <div id="stage-meter" class="meter"></div>
        <ol id="layer-names" class="now"></ol>
      </section>
      <p id="off-hint" class="hint"></p>

      <div class="actions">
        <button id="btn-next" class="btn primary" title="Random preset + FX">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg>Next
        </button>
        <button id="btn-auto-cycle" class="btn" title="Auto cycle presets with beat sync">
          <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
          <svg class="ic ic-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <span class="label">Auto</span>
        </button>
      </div>

      <div class="chips">
        <button id="auto-blend" class="chip" data-rnd="blend" title="Randomize blend mode"><i></i>Blend Rnd</button>
        <button id="auto-filters" class="chip" data-rnd="filters" title="Randomize filters"><i></i>Filter Rnd</button>
        <button id="chip-all-tabs" class="chip" title="Also turn ON in every tab you switch to"><i></i>All tabs</button>
      </div>

      <div class="opacity-row">
        <label for="opacity-slider">Opacity</label>
        <input type="range" id="opacity-slider" min="0" max="100" value="80" class="opacity-slider">
        <span id="opacity-value" class="opacity-value">80%</span>
      </div>

      <button id="btn-manual" class="disclosure" aria-expanded="false" aria-controls="manual-section">
        <span>Manual</span>
        <svg class="ic chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div id="manual-section" class="manual" hidden>
        <div class="section-label"><span>Effect</span><button id="lock-effect" class="auto-toggle lock-toggle" title="Lock presets">Lock</button></div>
        <input type="text" id="preset-search" class="preset-search" placeholder="Search presets...">
        <div class="preset-list" id="preset-list">
          <!-- Presets injected by popup.js -->
        </div>

        <div class="section-label"><span>Filters</span><button id="lock-filter" class="auto-toggle lock-toggle" title="Lock filters">Lock</button><button class="auto-toggle rnd-toggle" data-rnd="filters" title="Randomize filters"><i></i>Rnd</button></div>
        <!-- VJam 本体と同じ 5 個(brightness / sepia / blur はボタンだけ出さない。エンジンは保存済みのシーン・状態のために対応したまま) -->
        <div class="filter-grid" id="filter-grid">
          <button class="filter-btn" data-filter="invert">Invert</button>
          <button class="filter-btn" data-filter="hue-rotate">Hue Rot</button>
          <button class="filter-btn" data-filter="saturate">Saturate</button>
          <button class="filter-btn" data-filter="grayscale">Gray</button>
          <button class="filter-btn" data-filter="contrast">Contrast</button>
        </div>

        <div class="section-label"><span>Blend</span><button id="lock-blend" class="auto-toggle lock-toggle" title="Lock blend mode">Lock</button><button class="auto-toggle rnd-toggle" data-rnd="blend" title="Randomize blend mode"><i></i>Rnd</button></div>
        <div class="blend-grid" id="blend-grid">
          <button class="blend-btn" data-blend="lighten">Lighten</button>
          <button class="blend-btn" data-blend="difference">Diff</button>
          <button class="blend-btn" data-blend="exclusion">Exclusion</button>
          <button class="blend-btn" data-blend="color-dodge">Dodge</button>
        </div>

        <div class="section-label"><span>Scenes</span><button id="btn-scene-save" class="scene-save-btn" title="Save mode">Save</button><button id="btn-scenes-toggle" class="icon-btn small" title="Toggle scenes" aria-expanded="true" aria-controls="scenes-section"><svg class="ic chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
        <div id="scenes-section" class="scenes-section">
          <div class="scene-grid" id="scene-grid">
            <div class="scene-slot" data-slot="0"><button class="scene-btn" data-slot="0">1</button><button class="scene-del" data-slot="0" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="1"><button class="scene-btn" data-slot="1">2</button><button class="scene-del" data-slot="1" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="2"><button class="scene-btn" data-slot="2">3</button><button class="scene-del" data-slot="2" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="3"><button class="scene-btn" data-slot="3">4</button><button class="scene-del" data-slot="3" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="4"><button class="scene-btn" data-slot="4">5</button><button class="scene-del" data-slot="4" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="5"><button class="scene-btn" data-slot="5">6</button><button class="scene-del" data-slot="5" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="6"><button class="scene-btn" data-slot="6">7</button><button class="scene-del" data-slot="6" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="7"><button class="scene-btn" data-slot="7">8</button><button class="scene-del" data-slot="7" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="8"><button class="scene-btn" data-slot="8">9</button><button class="scene-del" data-slot="8" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="9"><button class="scene-btn" data-slot="9">10</button><button class="scene-del" data-slot="9" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="10"><button class="scene-btn" data-slot="10">11</button><button class="scene-del" data-slot="10" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
            <div class="scene-slot" data-slot="11"><button class="scene-btn" data-slot="11">12</button><button class="scene-del" data-slot="11" title="Clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
          </div>
        </div>

        <div class="section-label"><span>Text</span></div>
        <div id="text-section" class="text-section">
          <input type="text" id="text-input" class="text-input" placeholder="Enter text..." maxlength="200">
          <button id="btn-text-toggle" class="action-btn">GO</button>
        </div>

        <div class="manual-foot">
          <button id="btn-reset" class="action-btn reset" title="Reset all">Reset</button>
          <div class="audio-row">
            <label>Audio</label>
            <button id="audio-toggle" class="audio-btn on">ON</button>
          </div>
        </div>
      </div>
    </div>

    <!-- chrome:// やストアなど、重ねられないページ -->
    <div id="blocked" class="blocked" hidden>
      <img class="mark" src="mark.png" alt="">
      <p id="blocked-msg"></p>
    </div>

    <footer class="footer">
      <span id="heavy-skipped" class="skipped" hidden></span>
      <a id="vjam-link" href="https://vjam.vercel.app?utm_source=vjam-fx&utm_medium=extension&utm_campaign=popup-cta" target="_blank" rel="noopener">
        <span id="cta-text">Want more? Try VJam Full →</span>
      </a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
