<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VJam FX — promo tiles</title>
<!--
  Chrome ウェブストアのプロモーション画像。#small = 小タイル 440×280、#marquee = マーキー 1400×560。
  tests/e2e/store-screenshots.shots.js が、黒いページにエフェクトだけを出したスクショを --fx に入れて撮る(store/README.md)。
  ブラウザで直接開くと、背景はエフェクトの代わりのグラデーション
-->
<style>
:root { --fx: none; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050308; color: #fff; }
body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; }

.tile { position: relative; width: 100%; height: 100%; display: none; isolation: isolate; overflow: hidden; }
.small .tile.small, .marquee .tile.marquee { display: flex; }

/* エフェクト(無いときはグラデーション)+ 文字の後ろを暗く */
.fx { position: absolute; inset: 0; z-index: -2;
  background: var(--fx) center / cover no-repeat,
    radial-gradient(40% 60% at 25% 40%, rgba(255, 20, 147, .55), transparent 70%),
    radial-gradient(40% 60% at 75% 60%, rgba(139, 92, 246, .6), transparent 70%),
    radial-gradient(30% 50% at 60% 20%, rgba(0, 230, 220, .35), transparent 70%),
    #07060c; }
.shade { position: absolute; inset: 0; z-index: -1; }

.lockup { display: block; }
.tagline { font-weight: 700; letter-spacing: -.01em; text-shadow: 0 2px 16px rgba(0, 0, 0, .8); }
.points { color: rgba(255, 255, 255, .78); font-weight: 600; text-shadow: 0 2px 12px rgba(0, 0, 0, .8); }
.points span + span::before { content: ""; display: inline-block; width: .32em; height: .32em; border-radius: 50%;
  background: linear-gradient(135deg, #FF1493, #8B5CF6); margin: 0 .7em; vertical-align: .18em; }

/* 小タイル 440×280:真ん中にロゴとひとこと */
.tile.small { flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.tile.small .shade { background: radial-gradient(60% 55% at 50% 50%, rgba(0, 0, 0, .78), rgba(0, 0, 0, .35) 75%, rgba(0, 0, 0, .2)); }
.tile.small .lockup { width: 300px; }
.tile.small .tagline { font-size: 22px; }

/* マーキー 1400×560:左にロゴとひとこと、右はエフェクト */
.tile.marquee { flex-direction: column; justify-content: center; gap: 26px; padding-left: 110px; }
.tile.marquee .shade { background: linear-gradient(90deg, rgba(0, 0, 0, .85) 0%, rgba(0, 0, 0, .7) 38%, rgba(0, 0, 0, .1) 70%, rgba(0, 0, 0, 0) 100%); }
.tile.marquee .lockup { width: 560px; margin-left: -10px; }
.tile.marquee .tagline { font-size: 46px; }
.tile.marquee .points { font-size: 24px; }
</style>
<script>
  document.documentElement.className = location.hash === '#small' ? 'small' : 'marquee';
</script>
</head>
<body>

<div class="tile small">
  <div class="fx"></div><div class="shade"></div>
  <img class="lockup" src="../popup/lockup.png" alt="VJam FX">
  <p class="tagline">VJ effects for any web page</p>
</div>

<div class="tile marquee">
  <div class="fx"></div><div class="shade"></div>
  <img class="lockup" src="../popup/lockup.png" alt="VJam FX">
  <p class="tagline">VJ effects for any web page</p>
  <p class="points"><span>370 visuals</span><span>Beat sync</span><span>Auto mode</span></p>
</div>

</body>
</html>
