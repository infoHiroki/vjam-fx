name: VJamSimUI
options:
  bundleIdPrefix: com.vjam.simui
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vjam.simui.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vjam.simui.uitests
        TEST_TARGET_NAME: Host
schemes:
  SimUI:
    build:
      targets:
        Host: all
        SimUITests: [test]
    test:
      targets: [SimUITests]
